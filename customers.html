<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealBank – Customers</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="customers">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">RealBank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="customers.html" class="nav-link active">Customers</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="loans.html" class="nav-link">Loans</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="admin.html" class="nav-link">Admin</a>
      </nav>
      <button class="nav-link logout-link" id="logout-btn">Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle">☰</button>
        <h1 class="topbar-title">Customers</h1>
        <div class="topbar-right">
          <span class="pill" id="user-role-pill">Customer</span>
        </div>
      </header>

      <section class="content">
        <div class="toolbar">
          <input
            type="text"
            id="customer-search"
            class="input"
            placeholder="Search by name, account no. or phone..."
          />
          <button class="btn" id="add-customer-open">+ New Customer</button>
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Customer ID</th>
                  <th>Name</th>
                  <th>Account No.</th>
                  <th>Type</th>
                  <th>Balance</th>
                  <th>Phone</th>
                  <th>Email</th>
                </tr>
              </thead>
              <tbody id="customers-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Create Customer Modal -->
  <div class="modal" id="customer-modal">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-dialog">
      <header class="modal-header">
        <h2>New Customer</h2>
        <button class="icon-btn" data-close-modal>&times;</button>
      </header>

      <form id="customer-form" class="modal-body">
        <div class="grid two-columns gap">
          <div class="form-group">
            <label for="cust-name">Full Name</label>
            <input id="cust-name" required />
          </div>
          <div class="form-group">
            <label for="cust-type">Account Type</label>
            <select id="cust-type">
              <option value="Savings">Savings</option>
              <option value="Current">Current</option>
            </select>
          </div>
        </div>

        <div class="grid two-columns gap">
          <div class="form-group">
            <label for="cust-email">Email</label>
            <input id="cust-email" type="email" />
          </div>
          <div class="form-group">
            <label for="cust-phone">Phone</label>
            <input id="cust-phone" />
          </div>
        </div>

        <div class="form-group">
          <label for="cust-balance">Opening Balance (₹)</label>
          <input id="cust-balance" type="number" min="0" step="0.01" value="0" />
        </div>

        <footer class="modal-footer">
          <button type="button" class="btn ghost" data-close-modal>Cancel</button>
          <button type="submit" class="btn primary">Create Customer</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>

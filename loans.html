<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealBank – Loans</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="loans">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">RealBank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="customers.html" class="nav-link">Customers</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="loans.html" class="nav-link active">Loans</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="admin.html" class="nav-link">Admin</a>
      </nav>
      <button class="nav-link logout-link" id="logout-btn">Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle">☰</button>
        <h1 class="topbar-title">Loans</h1>
        <div class="topbar-right">
          <span class="pill" id="user-role-pill">Customer</span>
        </div>
      </header>

      <section class="content">
        <div class="grid two-columns gap">
          <section class="card">
            <div class="card-header">
              <h2>Loan Portfolio</h2>
              <select id="loan-status-filter" class="input small">
                <option value="">All statuses</option>
                <option value="Active">Active</option>
                <option value="Closed">Closed</option>
                <option value="Pending">Pending</option>
              </select>
            </div>

            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>Loan ID</th>
                    <th>Customer</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>EMI</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="loans-table-body"></tbody>
              </table>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <h2>New Loan Request</h2>
            </div>

            <form id="loan-form" class="stack gap">
              <div class="form-group">
                <label for="loan-customer">Customer</label>
                <select id="loan-customer" required></select>
              </div>

              <div class="grid two-columns gap">
                <div class="form-group">
                  <label for="loan-type">Loan Type</label>
                  <select id="loan-type">
                    <option value="Home">Home Loan</option>
                    <option value="Personal">Personal Loan</option>
                    <option value="Vehicle">Vehicle Loan</option>
                    <option value="Education">Education Loan</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="loan-amount">Amount (₹)</label>
                  <input id="loan-amount" type="number" min="10000" step="1000" required />
                </div>
              </div>

              <div class="grid two-columns gap">
                <div class="form-group">
                  <label for="loan-tenure">Tenure (months)</label>
                  <input id="loan-tenure" type="number" min="6" max="360" value="60" />
                </div>
                <div class="form-group">
                  <label for="loan-rate">Interest % (p.a.)</label>
                  <input id="loan-rate" type="number" min="5" max="20" value="10" />
                </div>
              </div>

              <p class="hint" id="loan-emi-preview">EMI: –</p>

              <button type="submit" class="btn primary full">Create Loan</button>
            </form>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>

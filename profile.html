<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealBank – Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="profile">
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">RealBank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="customers.html" class="nav-link">Customers</a>
        <a href="transactions.html" class="nav-link">Transactions</a>
        <a href="loans.html" class="nav-link">Loans</a>
        <a href="profile.html" class="nav-link active">Profile</a>
        <a href="admin.html" class="nav-link">Admin</a>
      </nav>
      <button class="nav-link logout-link" id="logout-btn">Logout</button>
    </aside>

    <!-- Main -->
    <main class="main">

      <header class="topbar">
        <button class="icon-btn" id="menu-toggle">☰</button>
        <h1 class="topbar-title">All Customer Profiles</h1>
        <div class="topbar-right">
          <span class="pill" id="user-role-pill">Customer</span>
        </div>
      </header>

      <section class="content">
        <section class="card">
          <input type="text" id="profile-search" class="input" placeholder="Search by name, account, phone, email..." style="margin-bottom: 15px;">
          <div id="all-profiles"></div>
        </section>
      </section>

    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>

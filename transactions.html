<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RealBank – Transactions</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="transactions">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">RealBank</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="customers.html" class="nav-link">Customers</a>
        <a href="transactions.html" class="nav-link active">Transactions</a>
        <a href="loans.html" class="nav-link">Loans</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="admin.html" class="nav-link">Admin</a>
      </nav>
      <button class="nav-link logout-link" id="logout-btn">Logout</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-toggle">☰</button>
        <h1 class="topbar-title">Transactions</h1>
        <div class="topbar-right">
          <span class="pill" id="user-role-pill">Customer</span>
        </div>
      </header>

      <section class="content">
        <div class="grid two-columns gap">
          <section class="card">
            <div class="card-header">
              <h2>All Transactions</h2>
            </div>

            <div class="toolbar">
              <select id="tx-account-filter" class="input">
                <option value="">All accounts</option>
              </select>
              <select id="tx-type-filter" class="input">
                <option value="">All types</option>
                <option value="Credit">Credit</option>
                <option value="Debit">Debit</option>
              </select>
            </div>

            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Account</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Balance After</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="transactions-table-body"></tbody>
              </table>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <h2>New Transaction</h2>
              <p class="card-subtitle">Simulate real-time credit / debit</p>
            </div>

            <form id="tx-form" class="stack gap">
              <div class="form-group">
                <label for="tx-account">Account</label>
                <select id="tx-account" required></select>
              </div>

              <div class="grid two-columns gap">
                <div class="form-group">
                  <label for="tx-type">Type</label>
                  <select id="tx-type">
                    <option value="Credit">Credit</option>
                    <option value="Debit">Debit</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="tx-amount">Amount (₹)</label>
                  <input id="tx-amount" type="number" min="1" step="0.01" required />
                </div>
              </div>

              <div class="form-group">
                <label for="tx-note">Note (optional)</label>
                <input id="tx-note" placeholder="e.g., ATM withdrawal, salary credit" />
              </div>

              <button type="submit" class="btn primary full">Post Transaction</button>
              <p class="hint">All updates are stored in browser localStorage (no backend).</p>
            </form>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
